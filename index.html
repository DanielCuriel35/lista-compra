<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<title>Lista Compra</title>

<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compra">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Pantalla de selección de usuario -->
<div id="login" class="login hidden" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="login-box">
        <img src="./favicon.png" alt="Lista de la compra" class="logo logo-lg">
        <h2 id="loginTitle">¿Quién eres?</h2>
        <p class="login-sub">Así sabremos quién apunta cada cosa.</p>
        <div id="userButtons" class="user-grid"></div>
    </div>
</div>

<!-- Confirmación -->
<div id="confirm" class="sheet-backdrop hidden">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirmText">
        <p id="confirmText"></p>
        <div class="sheet-actions">
            <button id="confirmNo" class="btn btn-ghost">Cancelar</button>
            <button id="confirmYes" class="btn btn-danger">Eliminar</button>
        </div>
    </div>
</div>

<div class="app">

    <header class="header">
        <img src="./favicon.png" alt="Lista de la compra" class="logo">
        <div class="header-text">
            <h1>Lista de la compra</h1>
            <p id="summary" class="summary">&nbsp;</p>
        </div>
        <button id="btnChangeUser" class="user-chip" title="Cambiar usuario">
            <span id="chipAvatar" class="avatar"></span>
            <span id="chipName"></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
    </header>

    <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="lista" role="tab" aria-selected="true">Lista</button>
        <button class="tab" data-tab="registros" role="tab" aria-selected="false">Registros</button>
    </nav>

    <div id="viewLista">

    <!-- Avisar a los demás -->
    <div class="estoy">
        <span class="estoy-label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            Estoy en
        </span>
        <label class="super-select">
            <select id="selEstoy" aria-label="Supermercado en el que estás"></select>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <button id="btnAvisar" class="btn-avisar">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span>Avisar</span>
        </button>
    </div>
    <div id="avisosEstado" class="avisos-estado hidden"></div>

    <form id="composer" class="composer" autocomplete="off">
        <input id="txtProduct" placeholder="¿Qué hace falta?" enterkeyhint="done" autocapitalize="sentences" aria-label="Añadir producto">
        <label class="super-select">
            <select id="selSuper" aria-label="Supermercado"></select>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <button id="btnAdd" type="submit" class="add" aria-label="Añadir">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </form>

    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

    <div id="filters" class="filters" role="group" aria-label="Filtrar por supermercado"></div>

    <section>
        <h3 class="section-title">Por comprar <span id="pending" class="count"></span></h3>
        <ul id="listPending" class="list"></ul>
        <div id="emptyPending" class="empty hidden">
            <span class="empty-emoji">🧺</span>
            <p id="emptyText">No falta nada. Apunta lo primero que se acabe.</p>
        </div>
    </section>

    <section id="doneSection" class="section-done hidden">
        <h3 class="section-title">En el carro <span id="done" class="count"></span></h3>
        <ul id="listDone" class="list list-done"></ul>
    </section>

    <button id="btnCompraHecha" class="btn-compra hidden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        Compra hecha
    </button>

    </div>

    <!-- Registros -->
    <div id="viewRegistros" class="hidden">

        <div id="registrosLista">
            <ul id="registros" class="registros"></ul>
            <div id="registrosVacio" class="empty hidden">
                <span class="empty-emoji">🧾</span>
                <p>Aún no hay compras guardadas. Cuando termines una compra, pulsa <strong>Compra hecha</strong> en la lista.</p>
            </div>
        </div>

        <div id="registroDetalle" class="hidden">
            <button id="btnVolver" class="back">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                Registros
            </button>
            <h2 id="detalleFecha" class="detalle-fecha"></h2>
            <p id="detalleInfo" class="detalle-info"></p>
            <div id="regFilters" class="filters" role="group" aria-label="Filtrar por supermercado"></div>
            <ul id="regItems" class="list reg-items"></ul>
            <div id="regVacio" class="empty hidden"><p id="regVacioText"></p></div>
            <div id="regAcciones" class="reg-acciones"></div>
        </div>

    </div>

</div>

<div id="toast" class="toast hidden" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="personajes.js"></script>

<script src="app.js"></script>

</body>
</html>
