<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lista Compra</title>

<link rel="icon" type="image/png" href="./favicon.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Pantalla de selección de usuario -->
<div id="login" class="login hidden">
<div class="login-box">
<img src="./favicon.png" alt="Carro de la compra" class="title-icon">
<h2>¿Quién eres?</h2>
<div id="userButtons" class="user-buttons"></div>
</div>
</div>

<div class="app">

<div class="title-container">
<img src="./favicon.png" alt="Carro de la compra" class="title-icon">
<h1>Lista de la compra</h1>
</div>

<div class="current-user">
<span id="currentUser"></span>
<button id="btnChangeUser" class="link-button">Cambiar usuario</button>
</div>

<div class="toolbar">
<input id="txtProduct" placeholder="Añadir producto">
<button id="btnAdd">Añadir</button>
</div>

<div class="stats">
<span id="pending"></span>
<span id="done"></span>
</div>

<div id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="app.js"></script>

</body>
</html>
